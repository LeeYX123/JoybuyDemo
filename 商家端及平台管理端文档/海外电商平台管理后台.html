async function initializeAdminAuth(){let box=document.createElement('div');box.id='adminLoginRoot';document.body.appendChild(box);document.body.classList.add('admin-locked');for(let u of state.users){u.account??=u.id==='OP001'?'admin':u.id.toLowerCase();u.permissions??=presetAccountPermissions(u.role)}let admin=state.users.find(u=>u.id==='OP001');if(!admin.passwordHash)await setAdminCredential(admin,'Admin@123456');save();let session;try{session=JSON.parse(sessionStorage.getItem('platformAdminSessionV1')||'null')}catch(e){}let u=session&&state.users.find(u=>u.id===session.id&&u.credentialVersion===session.version&&u.state==='启用');if(u&&adminPermissionList(u).some(p=>p.read)){loggedInAdmin=u;currentRole=u.role;document.body.classList.remove('admin-locked');render()}else authLoginView()}
const adminAuthReady=initializeAdminAuth().catch(e=>authLoginView('登录模块初始化失败，请刷新重试'));
</script></body></html>
