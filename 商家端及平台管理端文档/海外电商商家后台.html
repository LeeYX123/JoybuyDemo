function chart(){let nums=period==='week'?[76,110,94,138,122,98,128]:[400,560,430,720,610,670];let labels=period==='week'?['10/25','10/26','10/27','10/28','10/29','10/30','10/31']:['第1周','第2周','第3周','第4周','第5周','本周'];return `<div class="chart"><div class="axis"><span>${period==='week'?160:800}</span><span>${period==='week'?120:600}</span><span>${period==='week'?80:400}</span><span>${period==='week'?40:200}</span><span>0</span></div>${nums.map((n,i)=>`<div class="bar" data-value="${n} 笔" style="--h:${n/(period==='week'?160:800)*90}%"><span>${labels[i]}</span></div>`).join('')}</div>`}

function listProduct(i){listed.push(i);save();render();toast('商品已上架至您的店铺')}function productDetail(i){let p=products[i];modal(p[0],`<div class="image" style="text-align:center">${art(p[4])}</div><p>类目：${p[1]}</p><p>建议零售价：${money(p[2])}</p><p>发货成本价：${money(p[3])}</p><div class="rule">平台统一维护商品规格与销售范围。商品上架后，如需下架请联系客服处理。</div>`,listed.includes(i)?'':btn('上架至店铺',`listProduct(${i});closeModal()`,true))}

function detailPage(){let o=orders[selected],p=products[o[1]],can=['待发货','待处理'].includes(status(o));return head('订单详情',o[0],btn('返回订单列表','go(2)'))+`<div class="card" style="margin-bottom:22px"><div class="cardhead"><h2>订单状态　${tag(status(o))}</h2><span class="small">下单时间：2026-10-31 ${o[2]}</span></div><div class="timeline"><span>● 用户下单</span><span>● 商家发货</span><span>● 确认收货</span><span>● 回款结算</span></div></div><div class="split"><div class="card"><h2>商品与订单信息</h2><div style="display:flex;gap:24px;align-items:center;margin:20px 0"><div style="width:140px;background:#f7f8fa">${art(p[4])}</div><div><h3>${p[0]}</h3><p class="small">${p[1]}　/　标准款　/　数量 1</p><h3>${money(o[3])}</h3></div></div><div class="info"><div><label>订单编号</label>${o[0]}</div><div><label>配送地区</label>美国 · California</div><div><label>收件人</label>Alex W.（已脱敏）</div><div><label>订单来源</label>寰球优选全球商城</div></div></div><div class="card"><h2>发货与资金校验</h2><div class="info"><div><label>发货成本价</label><b class="red">${money(p[3])}</b></div><div><label>钱包余额</label>${money(balance)}</div></div><p class="small">确认发货后，将从钱包扣除对应成本价。</p><button class="primary" style="width:100%;margin-top:22px" ${!can||sealed?'disabled':''} onclick="confirmShip()">${can?'确认发货':'已完成发货'}</button><div class="rule"><b>收货后回款</b><br>用户确认收货成功后，货款立即返还商家钱包。<br><br><b>7天自动确认收货</b><br>用户未主动确认时，签收满14天系统自动确认收货并回款。</div></div></div>`}
function confirmShip(){let o=orders[selected],cost=products[o[1]][3];if(balance<cost){modal('钱包余额不足','<p>请联系客服完成充值入账后再继续发货。</p>',btn('联系客服','support()',true));return}modal('确认发货',`<p>订单 ${o[0]}</p><div class="rule">本次将扣除发货成本 ${money(cost)}。扣款后钱包余额为 ${money(balance-cost)}。</div>`,btn('确认扣款并发货',`ship(${selected})`,true))}function ship(i){let o=orders[i];if(sent.includes(o[0]))return;balance-=products[o[1]][3];sent.push(o[0]);save();closeModal();render();toast('发货成功，成本已从钱包扣除')}

function merchantOrderProgress(o){return o.orderMeta?o.orderMeta.progress:orderIsConfirmed(o)?7:status(o)==='待处理'?-1:sent.includes(o[0])?0:3}
function merchantProgressTimeline(o){let step=merchantOrderProgress(o),times=o.orderMeta?.nodeTimes||[];return `<section class="card od-progress"><div class="od-card-title"><h2>订单进度</h2>${step>=0?'<span class="od-step-count">'+(step+1)+' / '+milestones.length+'</span>':''}</div><div class="od-timeline">${milestones.map((name,i)=>{let reached=i<=step,time=times[i]||(!o.orderMeta&&reached&&!sent.includes(o[0])?'2026-11-01 10:'+String(i*5).padStart(2,'0'):reached?'未记录':'—');return `<div class="od-node ${reached?'is-done':''} ${i===step?'is-current':''}"><span class="od-node-dot">${i<step?'✓':i===step?'●':''}</span><div><div class="od-node-heading"><b>${esc(name)}</b>${i===step?'<span>当前</span>':''}</div><time>${esc(time)}</time></div></div>`}).join('')}</div></section>`}

detailPage=function(){let o=orders[selected],p=products[o[1]],confirmed=orderIsConfirmed(o),can=unshipped(o),date=o.orderMeta?.date||'2026-10-31 '+o[2],unitCost=o.orderMeta?.unitCost??p[3];let info=`<section class="card od-information"><div class="od-card-title"><h2>订单与商品信息</h2></div><div class="od-product"><div class="od-product-art">${art(p[4])}</div><div><h3>${esc(p[0])}</h3><p>${esc(p[1])} · 标准款</p><span>数量 × ${qty(o)}</span></div><strong>${money(o[3])}</strong></div><div class="od-fields"><div><label>订单编号</label><span>${esc(o[0])}</span></div><div><label>下单时间</label><span>${esc(date)}</span></div><div><label>支付方式</label><span>${esc(merchantOrderPayment(o))}</span></div><div><label>收件地区</label><span>德国 · Berlin</span></div><div><label>商品零售价</label><span>${money(o[3])}</span></div><div><label>商品成本价</label><span>${money(unitCost)}</span></div></div></section>`;let financial=`<section class="card od-financial"><div class="od-card-title"><h2>订单金额</h2></div><div class="od-money-row"><span>商品数量</span><b>${qty(o)}</b></div><div class="od-money-row"><span>订单金额</span><b>${money(totalPrice(o))}</b></div><div class="od-money-row"><span>成本合计</span><b>${money(totalCost(o))}</b></div><div class="od-profit"><span>${confirmed?'盈利':'回款后预估盈利'}</span><strong>${money(totalPrice(o)-totalCost(o))}</strong></div></section>`;return head('订单详情','',action('返回订单列表','go(3)'))+`<div class="od-page"><section class="card od-summary"><div><div class="od-summary-heading"><h2>${esc(o[0])}</h2>${tag(status(o))}</div><span class="od-order-date">下单时间　${esc(date)}</span></div><div class="od-summary-amount"><span>发货成本（合计）</span><strong>${money(totalCost(o))}</strong></div>${can?action('发货','confirmShip()',true,sealed):''}</section><div class="od-layout ${confirmed?'od-completed':''}">${confirmed?info:merchantProgressTimeline(o)}<div class="od-right">${confirmed?'':info}${financial}</div></div></div>`};pages[4]=detailPage;
const renderBeforeConfirmedOrders=render;render=function(){syncConfirmedOrders();renderBeforeConfirmedOrders()};if(typeof window.addEventListener==='function')window.addEventListener('storage',e=>{if(e.key==='merchantOrderSyncV2')render()});syncConfirmedOrders();render();


const OrderLifecycle=(()=>{
const KEY='orderLifecycleV3',H=3600000,DAY=24*H,RANGES=[[4,8],[6,12],[3,6],[48,120],[10,18],[6,16]];
function parse(v){if(typeof v==='number')return v;if(!v)return null;let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?$/.test(s))s=s.replace(' ','T')+(s.length===16?':00':'')+'+08:00';let n=Date.parse(s);return Number.isFinite(n)?n:null}
function format(n){return n==null?'':new Date(n).toLocaleString('sv-SE',{timeZone:'Asia/Shanghai',hour12:false})}
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{"version":3,"orders":{}}')}catch(e){return {version:3,orders:{}}}}
function write(db){localStorage.setItem(KEY,JSON.stringify(db))}
function sample(random=Math.random){return RANGES.map(([min,max])=>(min*3600+Math.floor(Math.max(0,Math.min(.999999999,random()))*((max-min)*3600+1)))*1000)}
function plan(o,clock){let anchor=parse(o.nodeTimes[o.progress])??o.stageAnchorAt??clock;o.plannedTimes=Array(8).fill(null);for(let i=0;i<=o.progress;i++)o.plannedTimes[i]=parse(o.nodeTimes[i]);for(let i=Math.max(1,o.progress+1);i<=6;i++){let chosen=parse(o.nodeTimes[i]);anchor=chosen??anchor+o.durationsMs[i-1];o.plannedTimes[i]=anchor}let signed=o.progress>=6?parse(o.nodeTimes[6])??o.stageAnchorAt:o.plannedTimes[6];o.receiptDeadlineAt=signed==null?null:signed+14*DAY;o.plannedTimes[7]=o.receiptDeadlineAt;o.nextDueAt=o.progress>=7?null:o.progress<0?null:o.plannedTimes[o.progress+1];return o}
function register(input,clock=Date.now(),random=Math.random){let db=read();if(db.orders[input.id])return db.orders[input.id];let progress=Math.max(-1,Math.min(7,Number.isFinite(Number(input.progress))?Number(input.progress):-1)),times=Array.from({length:8},(_,i)=>input.nodeTimes?.[i]||'');let shipped=parse(input.shippedAt)||parse(times[0]);if(shipped!=null)times[0]=format(shipped);let o={id:input.id,merchantId:input.merchantId,buyerId:input.buyerId||null,amount:input.amount,progress,nodeTimes:times,shippedAt:shipped,stageAnchorAt:parse(times[progress])??clock,durationsMs:sample(random),events:[],receipt:progress===7?{key:'ORDER_RECEIPT:'+input.id,time:input.settledAt||format(clock),source:'legacy',amount:input.amount,baseline:!!input.settled}:null,revision:1};plan(o,clock);db.orders[o.id]=o;write(db);return o}
function advance(o,target,time,source){time=Math.floor(time/1000)*1000;let before=o.progress;if(target<=before)return false;for(let i=before+1;i<=target;i++)if(!o.nodeTimes[i]||parse(o.nodeTimes[i])>time)o.nodeTimes[i]=format(time);o.progress=target;o.stageAnchorAt=time;if(o.shippedAt==null&&target>=0){o.shippedAt=parse(o.nodeTimes[0])??time;o.nodeTimes[0]=format(o.shippedAt)}o.events.push({id:o.id+':'+target+':'+time,node:target,time:format(time),source});if(target===7&&!o.receipt)o.receipt={key:'ORDER_RECEIPT:'+o.id,time:format(time),source,amount:o.amount,baseline:false};o.revision++;plan(o,time);return true}
function ship(id,time=Date.now()){time=Math.floor(time/1000)*1000;let db=read(),o=db.orders[id];if(!o)throw Error('订单不存在');if(o.progress>=0)return o;o.nodeTimes[0]=format(time);o.shippedAt=time;advance(o,0,time,'merchant_ship');db.orders[id]=o;write(db);return o}
function tick(clock=Date.now()){let db=read(),changed=[];for(let o of Object.values(db.orders)){if(o.progress<0||o.progress>=7)continue;let hit=false;while(o.progress<7&&o.nextDueAt!=null&&o.nextDueAt<=clock){let due=o.nextDueAt;advance(o,o.progress+1,due,o.progress===6?'auto_receipt_14d':'automatic');hit=true}if(hit)changed.push(o)}if(changed.length)write(db);return changed}
function manual(id,target,source,clock=Date.now(),buyerId=null){let db=read(),o=db.orders[id];if(!o)throw Error('订单不存在');if(source==='buyer_confirm'&&(!buyerId||!o.buyerId||o.buyerId!==buyerId))throw Error('当前用户无权确认此订单');if(o.progress>=7)return o;if(!Number.isInteger(target)||target<0||target>7||target<=o.progress)throw Error('请选择后续进度节点');if(source==='buyer_confirm'){if(!buyerId||!o.buyerId||o.buyerId!==buyerId)throw Error('当前用户无权确认此订单');if(o.progress<0)throw Error('订单尚未发货');target=7}else if(source==='admin_progress'){if(o.progress<0)throw Error('订单尚未发货');if(target===7&&o.progress!==6)throw Error('请在已签收后确认用户收货，或使用一键完成全部节点')}else if(source!=='admin_complete')throw Error('不支持的手动确认来源');if(o.nodeTimes.some((t,i)=>i<=o.progress&&parse(t)>clock))throw Error('已有节点时间晚于当前时间，请先调整');advance(o,target,clock,source);write(db);return o}
function editTimes(id,times,clock=Date.now()){let db=read(),o=db.orders[id];if(!o)throw Error('订单不存在');o.nodeTimes=Array.from({length:8},(_,i)=>times[i]||'');if(parse(o.nodeTimes[0])!=null)o.shippedAt=parse(o.nodeTimes[0]);else if(o.shippedAt!=null)o.nodeTimes[0]=format(o.shippedAt);o.stageAnchorAt=parse(o.nodeTimes[o.progress])??clock;o.revision++;plan(o,clock);write(db);return o}
function get(id){return read().orders[id]||null}
return {KEY,H,DAY,RANGES,parse,format,sample,register,ship,tick,manual,editTimes,get,all:()=>Object.values(read().orders)};
})();


let pendingShipClock={};
function merchantLifecycleInput(o){let meta=o.orderMeta,p=products[o[1]],progress=meta?.progress??merchantOrderProgress(o);return {id:o[0],merchantId:confirmationMerchantId,buyerId:meta?.buyerId,amount:totalPrice(o),progress,nodeTimes:meta?.nodeTimes||[],shippedAt:meta?.shippedAt,settled:orderIsConfirmed(o)||confirmationReceipts.some(r=>r.order===o[0]),settledAt:meta?.settledAt}}
function publishMerchantLifecycleOrder(o,e){let all={};try{all=JSON.parse(localStorage.getItem('merchantOrderSubmissionsV3')||'{}')}catch(err){}let p=products[o[1]],meta=o.orderMeta;all[o[0]]={id:o[0],merchant:confirmationMerchantId,buyerId:meta?.buyerId||null,date:meta?.date||'2026-10-31 '+o[2],productInfo:{id:'SPU202600'+String(o[1]+1).padStart(3,'0'),name:p[0],category:p[1],price:o[3],cost:meta?.unitCost??p[3],status:'可售',stores:1},unitPrice:o[3],unitCost:meta?.unitCost??p[3],qty:qty(o),status:e.progress>=7?'已完成':e.progress>=0?'已发货':'待处理',progress:e.progress,nodeTimes:e.nodeTimes,shippedAt:OrderLifecycle.format(e.shippedAt),paymentMethod:merchantOrderPayment(o),settled:e.receipt?.baseline||false};localStorage.setItem('merchantOrderSubmissionsV3',JSON.stringify(all))}
let merchantAutoBusy=false;
function runMerchantAutoProgress(clock=Date.now()){if(merchantAutoBusy)return false;merchantAutoBusy=true;try{for(let o of orders){let e=OrderLifecycle.register(merchantLifecycleInput(o),clock);if(e.progress<0&&sent.includes(o[0])){e=OrderLifecycle.ship(o[0],pendingShipClock[o[0]]||clock);delete pendingShipClock[o[0]];publishMerchantLifecycleOrder(o,e)}}let changed=OrderLifecycle.tick(clock).length>0;for(let o of orders){let e=OrderLifecycle.get(o[0]);if(!e)continue;let meta=o.orderMeta||{id:o[0],merchant:confirmationMerchantId,date:'2026-10-31 '+o[2],unitPrice:o[3],unitCost:products[o[1]][3],qty:qty(o),paymentMethod:merchantOrderPayment(o)};if(meta.progress!==e.progress||meta.autoRevision!==e.revision)changed=true;o.orderMeta={...meta,progress:e.progress,status:e.progress>=7?'已完成':e.progress>=0?'已发货':'待处理',nodeTimes:e.nodeTimes.slice(),shippedAt:OrderLifecycle.format(e.shippedAt),automaticPlan:{durationsMs:e.durationsMs,plannedTimes:e.plannedTimes,nextDueAt:e.nextDueAt,receiptDeadlineAt:e.receiptDeadlineAt,version:3},autoRevision:e.revision};if(e.receipt&&!e.receipt.baseline&&!confirmationReceipts.some(r=>r.order===o[0]))confirmationReceipts.push({id:'RCPT:'+o[0],order:o[0],amount:e.receipt.amount,time:e.receipt.time,type:'订单回款',state:'已完成'});if(e.progress>=7)o.orderMeta.settled=true}let credited=false;for(let r of confirmationReceipts)if(!appliedConfirmationReceipts.includes(r.id)){balance=Math.round((balance+r.amount)*100)/100;appliedConfirmationReceipts.push(r.id);credited=true}localStorage.setItem('confirmationReceiptsV2_'+confirmationMerchantId,JSON.stringify(confirmationReceipts));if(credited){localStorage.setItem('appliedConfirmationReceiptsV2_'+confirmationMerchantId,JSON.stringify(appliedConfirmationReceipts));save()}return changed||credited}finally{merchantAutoBusy=false}}
const syncBeforeAutoProgress=syncConfirmedOrders;syncConfirmedOrders=function(){syncBeforeAutoProgress();runMerchantAutoProgress()};
const shipBeforeAutoProgress=ship;ship=function(i){let o=orders[i];pendingShipClock[o[0]]=Date.now();OrderLifecycle.register(merchantLifecycleInput(o));let result=shipBeforeAutoProgress(i);runMerchantAutoProgress();render();return result};
function confirmMallOrderReceipt(orderId,buyerId){let e=OrderLifecycle.get(orderId);if(!e||!buyerId||e.buyerId!==buyerId)throw Error('当前用户无权确认此订单');let result=OrderLifecycle.manual(orderId,7,'buyer_confirm',Date.now(),buyerId);runMerchantAutoProgress();render();return result}
if(typeof window.addEventListener==='function'){window.addEventListener('storage',e=>{if([OrderLifecycle.KEY,'merchantOrderSyncV2'].includes(e.key)){runMerchantAutoProgress();render()}});window.addEventListener('focus',()=>{if(runMerchantAutoProgress())render()})}
function merchantAutoProgressTimer(){if(runMerchantAutoProgress())render();setTimeout(merchantAutoProgressTimer,15000)}merchantAutoProgressTimer();render();
</script></body></html>
