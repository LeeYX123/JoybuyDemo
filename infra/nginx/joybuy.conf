# WP-40: production Nginx entry for Joybuy (single server).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/joybuy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joybuy/privkey.pem;

    client_max_body_size 25m;

    # Media served directly from disk; no CDN, no external origins.
    location /media/ {
        alias /srv/joybuy/data/media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Storefront (Nuxt SSR).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (Django).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA (Vue build, static).
    location /admin/ {
        alias /srv/joybuy/admin-dist/;
        try_files $uri $uri/ /admin/index.html;
    }
}
