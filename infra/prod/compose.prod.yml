# WP-40A: production services. App containers deploy via WP-40B.
services:
  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: joybuy
      MYSQL_USER: joybuy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 12
    ports:
      - "127.0.0.1:3306:3306"

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit:v1.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
  redis-data:
