name: joybuy-dev

services:
  mysql:
    image: mysql:8.4.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-joybuy}
      MYSQL_USER: ${MYSQL_USER:-joybuy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-joybuy_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-joybuy_root_dev_only}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      # 2026-11-26：连接与内存调优（翻译 + 爬虫 + 前端三端并存）。
      # 连接上限 151→500；buffer pool 128M→2G（本机 64GB 内存空闲充足）；
      # 闲置连接 8h→4h 自动断开，避免 Sleep 连接堆积挤占上限。
      - --max-connections=500
      - --innodb-buffer-pool-size=2G
      - --wait-timeout=14400
      - --interactive-timeout=14400
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-33060}:3306"
    volumes:
      - joybuy_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  redis:
    image: redis:7.4.6-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-63790}:6379"
    volumes:
      - joybuy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
    ports:
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MAIL_PORT:-1025}:1025"
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${MAIL_UI_PORT:-8025}:8025"
    volumes:
      - joybuy_mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  joybuy_mysql_data:
    name: joybuy_dev_mysql_data
  joybuy_redis_data:
    name: joybuy_dev_redis_data
  joybuy_mailpit_data:
    name: joybuy_dev_mailpit_data

